# GMC platform v2.0 — AI-First Group Mediclaim Underwriting (Opexminds DS)
# Replaces the v1 retirement page (v1 retired 2026-10-12; backup ~/gmc-archive-v1/)
server {
    listen 443 ssl http2;
    server_name gmc.darvis.si;

    # same certs as v1 block used
    ssl_certificate     /etc/letsencrypt/live/darvis.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darvis.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass         http://127.0.0.1:5062;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
